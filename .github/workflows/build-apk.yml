name: Build Android APK

# ============================================================
#  GTO 助手 - GitHub Actions 云端打包
#
#  为什么用云端：Buildozer 只能在 Linux 上跑，Windows 不支持。
#  推送到 GitHub 后由云端的 Linux 机器帮你打包，全程免费。
#
#  用法：
#    1. 把整个 poker_gto_android 目录推到 GitHub 仓库
#    2. 打开仓库的 Actions 页，选 "Build Android APK"
#    3. 点 "Run workflow" 手动触发（或直接 push 自动触发）
#    4. 等 20-40 分钟，在页面底部 Artifacts 下载 apk
#
#  首次构建要下载 Android SDK/NDK，比较慢；之后有缓存会快很多。
#
#  ------------------------------------------------------------
#  【排错提醒】如果你只看到这一句：
#      "No files were found with the provided path: apk-output/*.apk"
#  那它不是真正的原因，只是"没有产物可上传"的结果。真正的原因
#  一定在下面这两个地方之一：
#    a) 失败步骤的 "构建失败诊断" 摘要（Summary 页）
#    b) Artifacts -> build-log（完整 build.log）
#  本文件已保证：构建失败时日志一定会打印出来，不会再被吞掉。
#  ------------------------------------------------------------
# ============================================================

'on':
  push:
    branches: [ main, master ]
    paths:
      - 'poker_gto_android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:        # 允许手动点按钮触发

jobs:
  build:
    # 用 22.04 而不是 ubuntu-latest：p4a v2024.01.21 是在这一代系统上
    # 验证的（Python 3.10、libtinfo5 还在）。24.04 移除了 libtinfo5，
    # 且默认 Python 3.12 已删掉 distutils，p4a 会踩坑。
    # 注意：22.04 镜像从 2026-09-17 起进入弃用期，2027-04-17 彻底下线，
    # 到时要迁到 24.04（需同步调整依赖与 p4a 版本）。
    runs-on: ubuntu-22.04

    # 首次构建要下 SDK/NDK + 交叉编译 numpy，给足余量
    timeout-minutes: 120

    # 强制 UTF-8，避免非 ASCII 的 app 名称在 C locale 下写文件报错
    env:
      PYTHONUTF8: "1"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        # why：GitHub 的 22.04 runner 预装了 Android SDK、.NET、GHC 等
        # 十来个 G 我们用不到的东西。而 p4a 要自己下载整套 SDK + NDK
        # （解压后 ~8G），再交叉编译 numpy/pillow，磁盘很容易爆，
        # 爆了之后的报错五花八门（No space left on device），很难查。
        # 这里先把预装的清掉，腾出空间。
        run: |
          echo "==== 清理前 ===="
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          echo "==== 清理后 ===="
          df -h /

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            python3-pip python3-setuptools
          # libtinfo5 在 22.04 有、24.04 没有，装不上不算错
          sudo apt-get install -y libtinfo5 \
            || echo "libtinfo5 不可用（Ubuntu 24.04+ 属正常），跳过"

      - name: 安装 Java 17（Gradle 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Buildozer 与 Cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # Cython 必须锁在 0.29.x：p4a v2024.01.21 不支持 Cython 3
          python -m pip install buildozer "cython==0.29.36"
          echo "---- 版本确认 ----"
          buildozer --version
          cython --version
          java -version

      - name: 缓存 Buildozer 的 SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            poker_gto_android/.buildozer
          # 用固定的版本号做 key，不要拼 buildozer.spec 的哈希——
          # 否则每次改一下 spec 都会让 ~5G 的 SDK/NDK 全部重下。
          # 真要换 NDK / p4a 版本时，把下面的 v4 手动 +1 即可
          # （换 key 同时也是一次"丢掉可能已损坏的中间产物"的机会）。
          key: buildozer-${{ runner.os }}-v4
          # 故意不写 restore-keys：旧 key 是一串 spec 哈希，如果是那批
          # 缓存坏了、导致构建中途"静默跳过"，前缀匹配会让它又回来。
          # 这里只认精确的 v4，宁可第一次慢一点，也要拿到干净环境。

      - name: 检查中文字体
        working-directory: poker_gto_android
        run: |
          # 用 od（coreutils 自带）取文件头十六进制，不用 xxd——
          # xxd 属于 vim-common，不保证每个 runner 都有。
          magic_of() { head -c 4 "$1" | od -An -tx1 | tr -d ' \n'; }

          # 正常情况下 assets/chinese.ttf（Noto Sans SC，开源可商用）
          # 已随代码提交。若缺失则临时下载一个。
          FONT_OK=0
          if [ -f assets/chinese.ttf ]; then
            SIZE=$(stat -c%s assets/chinese.ttf)
            MAGIC=$(magic_of assets/chinese.ttf)
            echo "已存在字体：${SIZE} 字节，魔术字节 ${MAGIC}"
            # 合法开头：00010000(TrueType) 4f54544f(OTTO) 74727565(true) 74746366(ttcf)
            case "$MAGIC" in
              00010000|4f54544f|74727565|74746366) FONT_OK=1 ;;
              *) echo "字体魔术字节不合法，疑似损坏，将重新下载" ;;
            esac
          fi

          if [ "$FONT_OK" != "1" ]; then
            echo "下载 Noto Sans SC..."
            mkdir -p assets
            curl -L --retry 3 -o assets/chinese.ttf \
              "https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf"
            MAGIC=$(magic_of assets/chinese.ttf)
            echo "下载后魔术字节：${MAGIC}"
            case "$MAGIC" in
              00010000|4f54544f|74727565|74746366) ;;
              *) echo "::error::字体下载后仍不是合法字体，界面中文会显示成方块"; exit 1 ;;
            esac
          fi
          ls -lh assets/chinese.ttf
          echo "字体已就绪"

      - name: 打包前体检
        working-directory: poker_gto_android
        # 体检里有一项是「Windows 不能打包」，在 Linux 上应为通过；
        # 这里不阻断构建，只打日志。
        run: python preflight.py || true

      - name: 打包 APK
        working-directory: poker_gto_android
        run: |
          # 两个要点：
          # 1) 用 yes 自动回答可能出现的交互式提问（SDK 许可证等）。
          #    buildozer.spec 里已设 android.accept_sdk_license = True，
          #    这里是双保险。
          # 2) 绝对不要写成 `buildozer ... | tail -n 200`——管道会让
          #    退出码变成 tail 的，构建失败时这一步仍然显示成绿色，
          #    错误被吞掉。用 PIPESTATUS 精确取 buildozer 自己的状态。
          set +e
          yes | buildozer -v android debug 2>&1 | tee build.log
          # PIPESTATUS[0]=yes  [1]=buildozer  [2]=tee
          STATUS=${PIPESTATUS[1]}
          echo "===================================="
          echo "buildozer 退出码: $STATUS"
          echo "===================================="
          if [ "$STATUS" -ne 0 ]; then
            echo "==== 构建失败，日志最后 150 行 ===="
            tail -n 150 build.log
          fi
          exit "$STATUS"

      - name: 校验产物
        # 这一步专门堵一个很难查的坑：buildozer 有时候会以退出码 0 结束，
        # 但 bin/ 下压根没有 apk（例如中间产物脏了、或它在某个子步骤里
        # 打印了错误却没有把错误码传出来）。这时如果直接去上传，你只会
        # 看到 "No files were found ... apk-output/*.apk" 这种毫无信息量
        # 的报错。所以这里先自己检查，没有就直接把日志甩出来。
        working-directory: poker_gto_android
        run: |
          echo "==== 磁盘剩余（排查 No space left on device）===="
          df -h / || true
          echo ""
          echo "==== bin/ 目录内容 ===="
          ls -lh bin/ 2>/dev/null || echo "(bin/ 目录不存在)"

          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            {
              echo '## 构建正常结束，但没有产出 apk'
              echo ""
              echo "buildozer 退出码为 0，但 \`bin/*.apk\` 不存在。"
              echo "下面是从 build.log 里摘出来的可疑行。"
              echo ""
              echo "### 可疑行"
              echo '```text'
              grep -n -i -E "error|failed|exception|no space|not found|licence|license|unable" \
                build.log 2>/dev/null | tail -n 60 || echo "(build.log 里没匹配到)"
              echo '```'
              echo ""
              echo "### build.log 尾部 120 行"
              echo '```text'
              tail -n 120 build.log 2>/dev/null || echo "(build.log 不存在)"
              echo '```'
              echo ""
              echo "> 完整日志见 Artifacts → build-log"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::buildozer 正常退出，但 bin/ 下没有 apk。原因见本步骤日志与 Summary 页。"
            echo "==== 全仓库搜一遍 apk（排除 SDK 自带的）===="
            find .. -name "*.apk" -not -path "*/android-sdk/*" 2>/dev/null | head -20 || true
            echo "==== build.log 尾部 200 行 ===="
            tail -n 200 build.log 2>/dev/null || echo "(build.log 不存在)"
            exit 1
          fi

          echo "找到产物：$APK"
          ls -lh "$APK"
          echo "产物校验通过"

      - name: 构建失败时输出诊断摘要
        if: failure()
        working-directory: poker_gto_android
        run: |
          # grep 没匹配到时会返回 1，先把结果落到文件，避免干扰判断
          grep -n -i -E "error|failed|exception|not found|no space|licence|license|unable" \
            build.log > /tmp/errs.txt 2>/dev/null || true
          {
            echo "## 构建失败诊断"
            echo ""
            echo "### 匹配到的关键错误行（最多 60 行）"
            echo '```text'
            tail -n 60 /tmp/errs.txt || true
            echo '```'
            echo ""
            echo "### 完整日志尾部 80 行"
            echo '```text'
            tail -n 80 build.log || true
            echo '```'
            echo ""
            echo "> 完整日志见本次运行的 Artifacts → build-log"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "诊断摘要已写入本次运行的 Summary 页"

      - name: 收集产物
        working-directory: poker_gto_android
        run: |
          mkdir -p ../apk-output
          # 用 find 而不是写死 bin/*.apk：万一 buildozer 把产物放到了
          # 别的地方（换 p4a 版本后输出目录可能变），也不会漏掉。
          find . -maxdepth 2 -name "*.apk" -exec cp -v {} ../apk-output/ \;
          echo "==== 待上传的产物 ===="
          ls -lh ../apk-output/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: gto-helper-apk
          path: apk-output/*.apk
          # 走到这里说明「校验产物」已经通过了，理论上有文件。
          # 真没有就报错，别静默给个空 artifact。
          if-no-files-found: error
          retention-days: 30

      - name: 上传完整构建日志（无论成败）
        # 关键：失败时也能把完整日志下载下来，不用靠截屏猜
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: poker_gto_android/build.log
          if-no-files-found: ignore
          retention-days: 30
